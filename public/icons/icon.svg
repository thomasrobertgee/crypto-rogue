<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a102a" />
      <stop offset="50%" stop-color="#0d0914" />
      <stop offset="100%" stop-color="#050308" />
    </linearGradient>

    <!-- Golden Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Neon Green Candle Gradient -->
    <linearGradient id="greenCandle" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Neon Cyan Shadow/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle / Rounded App Icon Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#goldRim)" stroke-width="12" />

  <!-- Cyber Grid Lines (Subtle) -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="2">
    <line x1="16" y1="128" x2="496" y2="128" />
    <line x1="16" y1="256" x2="496" y2="256" />
    <line x1="16" y1="384" x2="496" y2="384" />
    <line x1="128" y1="16" x2="128" y2="496" />
    <line x1="256" y1="16" x2="256" y2="496" />
    <line x1="384" y1="16" x2="384" y2="496" />
  </g>

  <!-- Green Bull Candlesticks in Background -->
  <g opacity="0.45">
    <!-- Candle 1 -->
    <line x1="110" y1="190" x2="110" y2="370" stroke="#22c55e" stroke-width="6" stroke-linecap="round" />
    <rect x="94" y="230" width="32" height="90" rx="6" fill="#22c55e" />

    <!-- Candle 2 (Mega Pump) -->
    <line x1="400" y1="120" x2="400" y2="340" stroke="#22c55e" stroke-width="6" stroke-linecap="round" />
    <rect x="384" y="160" width="32" height="130" rx="6" fill="#22c55e" />
  </g>

  <!-- Central Golden Bitcoin Shield Token -->
  <circle cx="256" cy="256" r="140" fill="#2c1a0e" stroke="url(#goldRim)" stroke-width="10" filter="url(#glow)" />
  <circle cx="256" cy="256" r="122" fill="url(#goldRim)" opacity="0.15" />

  <!-- Golden ₿ Symbol -->
  <g fill="url(#goldRim)">
    <path d="M 230 156 L 275 156 C 302 156 322 170 322 195 C 322 211 311 224 296 230 C 316 237 330 252 330 274 C 330 304 306 320 275 320 L 230 320 Z M 258 184 L 258 222 L 273 222 C 286 222 295 214 295 203 C 295 192 286 184 273 184 Z M 258 252 L 258 292 L 277 292 C 292 292 302 283 302 272 C 302 261 292 252 277 252 Z" />
    <!-- Vertical Serif Spikes for Bitcoin Glyph -->
    <rect x="252" y="136" width="12" height="24" rx="3" />
    <rect x="278" y="136" width="12" height="24" rx="3" />
    <rect x="252" y="316" width="12" height="24" rx="3" />
    <rect x="278" y="316" width="12" height="24" rx="3" />
  </g>

  <!-- Lightning Bolt Badge Overlay (Top Right of Coin) -->
  <polygon points="340,160 310,210 335,210 315,260 365,195 335,195" fill="#fde047" stroke="#451a03" stroke-width="3" filter="url(#glow)" />
</svg>